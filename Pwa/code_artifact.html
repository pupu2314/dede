<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服務價目表 - DeDe 男士專屬美容美體中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html { scroll-behavior: smooth; }
        .ocean-gradient { 
            background: linear-gradient(135deg, #f0fdfa 0%, #e0f2fe 50%, #dbeafe 100%); 
        }
        .price-line-through { text-decoration: line-through; color: #94a3b8; font-size: 0.85em; margin-right: 6px; }
        .promo-price { color: #ef4444; font-weight: bold; }
        
        /* 滾動時預留頂部懸浮選單與插圖的高度，避免標題被遮擋 */
        .scroll-offset { scroll-margin-top: 240px; } 
        
        /* 自訂美化捲軸 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="ocean-gradient min-h-screen text-slate-800 pb-16 antialiased">

    <div class="w-full max-w-7xl mx-auto bg-white min-h-screen shadow-2xl relative flex flex-col" id="app">
        
        <!-- 頂部動態 Banner 區塊 -->
        <div class="relative w-full overflow-hidden bg-slate-900 aspect-[3.5/1] md:aspect-[4.5/1]">
            <img 
                id="month-banner" 
                src="" 
                alt="本月主題計畫" 
                class="w-full h-full object-cover object-center transition-opacity duration-500 opacity-0"
                onload="this.classList.remove('opacity-0');"
                onerror="handleBannerError(this)"
            >
            <!-- 漸層遮罩與文字內容（當自訂圖片加載失敗或作為文字後備疊加） -->
            <div class="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-slate-900/30 to-transparent flex flex-col justify-end p-4 md:p-8">
                <div class="max-w-3xl">
                    <span class="inline-block bg-blue-600 text-white text-xs font-semibold px-2.5 py-1 rounded-full uppercase tracking-wider mb-2">
                        Men's Care & Grooming
                    </span>
                    <h1 class="text-xl sm:text-3xl md:text-4xl font-extrabold text-white tracking-wide drop-shadow-md">
                        DeDe 男士專屬美容美體中心
                    </h1>
                    <p class="text-blue-200 text-xs sm:text-base mt-1 font-medium tracking-widest drop-shadow-sm" id="page-subtitle">
                        載入中...
                    </p>
                </div>
            </div>
        </div>

        <!-- 頂端懸浮控制列 (Sticky Nav) -->
        <div class="sticky top-0 z-40 bg-white/90 backdrop-blur-md shadow-md border-b border-slate-100 px-4 py-3 w-full transition-all">
            <!-- 快速跳轉 -->
            <div id="quick-jump" class="flex flex-wrap justify-center gap-2 mb-3 max-h-[80px] overflow-y-auto py-1">
                <!-- JS 自動生成 -->
            </div>
            <!-- 優惠切換標籤 -->
            <div class="flex justify-center gap-2 max-w-sm mx-auto bg-slate-100 p-1 rounded-xl">
                <button onclick="setDiscount('normal')" id="tab-normal" class="tab-btn flex-1 bg-white text-blue-700 font-bold py-2 rounded-lg text-xs sm:text-sm shadow-sm transition-all duration-300">一般原價</button>
                <button onclick="setDiscount('student')" id="tab-student" class="tab-btn flex-1 text-slate-600 hover:text-slate-800 font-medium py-2 rounded-lg text-xs sm:text-sm transition-all duration-300">學生 8 折</button>
                <button onclick="setDiscount('birthday')" id="tab-birthday" class="tab-btn flex-1 text-slate-600 hover:text-slate-800 font-medium py-2 rounded-lg text-xs sm:text-sm transition-all duration-300">壽星 5 折</button>
            </div>
        </div>

        <!-- 內容主要區塊 -->
        <div class="p-4 md:p-8 pb-24 flex-grow">
            <!-- 載入中狀態 -->
            <div id="loading" class="flex flex-col items-center justify-center py-20 text-slate-500">
                <svg class="animate-spin h-10 w-10 text-blue-600 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span class="text-sm font-medium">正在為您讀取最新優惠資訊...</span>
            </div>

            <div id="content" class="hidden">
                <!-- 優惠與集點專區 -->
                <section id="promo-section" class="mb-12">
                    <h2 class="text-xl font-extrabold text-slate-800 mb-4 pb-2 border-b-2 border-slate-100 flex items-center">
                        <span class="mr-2.5 text-2xl" id="promo-header-icon">🔥</span> 
                        <span id="promo-header-text">本月活動與優惠</span>
                    </h2>
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        
                        <!-- 區塊 A：一般月促銷清單 (預設顯示) 與 區塊 B：專屬身分提示卡 (切換時顯示) -->
                        <div class="lg:col-span-2">
                            <!-- 促銷項目卡片容器 -->
                            <div id="promo-list" class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden">
                                <!-- 促銷項目將自動插入於此 -->
                            </div>

                            <!-- 專屬身份提示卡 -->
                            <div id="special-discount-msg" class="hidden h-full bg-gradient-to-br from-blue-500 to-indigo-600 p-6 sm:p-8 rounded-2xl text-white text-center shadow-lg flex flex-col items-center justify-center relative overflow-hidden">
                                <div class="absolute -right-10 -top-10 w-40 h-40 bg-white/10 rounded-full blur-xl pointer-events-none"></div>
                                <div id="special-discount-icon" class="text-6xl mb-4 filter drop-shadow">🎓</div>
                                <h3 id="special-discount-title" class="text-xl sm:text-2xl font-black mb-3 tracking-wide">已套用專屬優惠</h3>
                                <p id="special-discount-desc" class="text-sm sm:text-base text-blue-100 font-medium">提示訊息</p>
                            </div>
                        </div>
                        
                        <!-- 區塊 C：集點活動說明卡 (永遠顯示) -->
                        <div class="bg-gradient-to-br from-amber-500 to-orange-600 p-6 rounded-2xl text-white shadow-lg flex flex-col justify-between relative overflow-hidden">
                            <div class="absolute -right-8 -top-8 text-9xl opacity-15 select-none pointer-events-none font-bold">🎁</div>
                            <div>
                                <h3 class="font-extrabold text-lg mb-3 flex items-center">
                                    <span class="mr-2">🎁</span> 會員獨享集點計畫
                                </h3>
                                <div class="text-amber-50 leading-relaxed font-medium text-sm sm:text-base">
                                    當日單次消費滿 <strong class="text-white text-xl bg-amber-400/30 px-2 py-0.5 rounded mx-1">$1,500</strong> 即可獲得 1 點。<br>
                                    集滿 <strong class="text-yellow-300 text-lg">10 點</strong> 於下次消費立即折抵現金 <strong class="text-yellow-300 text-xl font-bold">$500</strong> 元！
                                </div>
                            </div>
                            <div class="text-[11px] text-amber-200 mt-6 pt-3 border-t border-white/20">
                                ※ 備註：折扣與集點額度皆以結帳時「實付金額」為基準計算。
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 完整服務項目列表 -->
                <section>
                    <h2 class="text-xl font-extrabold text-slate-800 mb-6 pb-2 border-b-2 border-slate-100 flex items-center">
                        <span class="mr-2.5 text-2xl">📋</span> 完整服務價目
                    </h2>
                    <div id="menu-list" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6">
                        <!-- 完整項目將自動插入於此 -->
                    </div>
                </section>
            </div>
        </div>
    </div>

    <!-- 懸浮預約按鈕 -->
    <div class="fixed bottom-0 left-0 w-full z-50 p-4 pointer-events-none flex justify-center">
        <a href="https://lin.ee/6fc6qGl" target="_blank" class="pointer-events-auto bg-[#06C755] text-white font-extrabold py-3.5 px-6 rounded-full shadow-[0_8px_30px_rgb(6,199,85,0.4)] hover:bg-[#05b34c] transition duration-300 transform hover:-translate-y-1 flex items-center justify-center w-full max-w-md">
            <svg class="w-7 h-7 mr-2.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
                <rect fill="#ffffff" width="320" height="320" rx="72.14"/>
                <path fill="#06c755" d="M266.66,144.92c0-47.74-47.86-86.58-106.69-86.58S53.28,97.18,53.28,144.92c0,42.8,38,78.65,89.22,85.42,3.48.75,8.21,2.29,9.4,5.26,1.08,2.7.71,6.93.35,9.65,0,0-1.25,7.53-1.52,9.13-.47,2.7-2.15,10.55,9.24,5.76s61.44-36.18,83.82-61.95h0C259.25,181.24,266.66,164,266.66,144.92Z"/>
                <path fill="#ffffff" d="M231.16,172.49h-30a2,2,0,0,1-2-2v0h0V123.94h0v0a2,2,0,0,1,2-2h30a2,2,0,0,1,2,2v7.57a2,2,0,0,1-2,2H210.79v7.85h20.37a2,2,0,0,1,2,2V151a2,2,0,0,1-2,2H210.79v7.86h20.37a2,2,0,0,1,2,2v7.56A2,2,0,0,1,231.16,172.49Z"/>
                <path fill="#ffffff" d="M120.29,172.49a2,2,0,0,0,2-2v-7.56a2,2,0,0,0-2-2H99.92v-37a2,2,0,0,0-2-2H90.32a2,2,0,0,0-2,2v46.53h0v0a2,2,0,0,0,2,2h30Z"/>
                <rect fill="#ffffff" x="128.73" y="121.85" width="11.64" height="50.64" rx="2.04"/>
                <path fill="#ffffff" d="M189.84,121.85h-7.56a2,2,0,0,0-2,2v27.66l-21.3-28.77a1.2,1.2,0,0,0-.17-.21v0l-.12-.12,0,0-.11-.09-.06,0-.11-.08-.06,0-.11-.06-.07,0-.11,0-.07,0-.12,0-.08,0-.12,0h-.08l-.11,0h-7.71a2,2,0,0,0-2,2v46.56a2,2,0,0,0,2,2h7.57a2,2,0,0,0,2-2V142.81l21.33,28.8a2,2,0,0,0,.52.52h0l.12.08.06,0,.1.05.1,0,.07,0,.14,0h0a2.42,2.42,0,0,0,.54.07h7.52a2,2,0,0,0,2-2V123.89A2,2,0,0,0,189.84,121.85Z"/>
            </svg>
            <span class="text-sm sm:text-base tracking-wider font-semibold">專屬一對一預約，立即加入官方 LINE</span>
        </a>
    </div>

    <!-- 自訂精美 Toast 通知元件 -->
    <div id="custom-toast" class="fixed top-6 left-1/2 transform -translate-x-1/2 z-50 transition-all duration-300 ease-out translate-y-[-100px] opacity-0 pointer-events-none">
        <div class="bg-slate-900/95 text-white px-6 py-3 rounded-full shadow-2xl flex items-center space-x-3 border border-slate-800 backdrop-blur-sm">
            <span id="toast-icon" class="text-xl">✨</span>
            <span id="toast-message" class="text-sm font-semibold tracking-wide">提示訊息</span>
        </div>
    </div>

    <script>
        let currentData = null;
        let currentDiscountType = 'normal'; 
        let hasPromoItems = false; 

        const fallbackData = {
          "categories": [
            {
              "name": "男士專屬除毛",
              "items": [
                { "id": "private_full", "name": "私密處除毛 (全除)", "price": 1900, "desc": "含三角處、陰莖、陰囊、會陰、肛門、鼠蹊部" },
                { "id": "nose", "name": "鼻毛", "price": 200 },
                { "id": "private_shape", "name": "私密處除毛 (局部/造型)", "price": 1900 },
                { "id": "private_trim", "name": "私密處毛修剪-一般修剪無痛(修剪+沐浴)", "price": 300 },
                { "id": "belly_lower", "name": "三角處除毛(下腹毛以下,根部以上)", "price": 800, "desc": "腹部下方至陰莖上方區域" },
                { "id": "armpit", "name": "腋下毛", "price": 600 },
                { "id": "belly_upper", "name": "上腹部毛(肚臍以上胸部以下)", "price": 600 },
                { "id": "belly_middle", "name": "下腹部毛(肚臍以下陰毛以上)", "price": 600 },
                { "id": "arm_half", "name": "半手臂", "price": 1300, "desc": "上手臂或下手臂擇一" },
                { "id": "arm_full", "name": "全手臂", "price": 2500, "desc": "上手臂及下手臂" },
                { "id": "finger", "name": "手指", "price": 300 },
                { "id": "hand_back", "name": "手背", "price": 300 },
                { "id": "toe", "name": "腳趾", "price": 300 },
                { "id": "foot_back", "name": "腳背", "price": 300 },
                { "id": "leg_calf", "name": "小腿", "price": 1900 },
                { "id": "leg_thigh", "name": "大腿", "price": 1900 },
                { "id": "leg_full", "name": "全腿", "price": 3500, "desc": "大腿及小腿" },
                { "id": "nipple", "name": "奶頭毛", "price": 200 },
                { "id": "chest", "name": "胸毛", "price": 600 },
                { "id": "private_area", "name": "區域單獨除毛", "price": 600, "desc": "陰莖、陰囊、會陰、肛門、鼠蹊部擇一部位" },
                { "id": "beard", "name": "鬍子熱蠟除毛(八字鬍與下巴)", "price": 1000 },
                { "id": "private_combo_part", "name": "私密處單一區域任選2部位", "price": 1200, "desc": "陰莖、陰囊、會陰、肛門、鼠蹊部擇兩部位" }
              ]
            },
            {
              "name": "男士專屬油壓",
              "items": [
                { "id": "oil_massage_1hr", "name": "[油推]能量精油 健康調理 /1hr(含機能保養)", "price": 1200 },
                { "id": "oil_massage_1.5hr", "name": "[油推]能量精油健康調理 /1.5hr(含機能保養)", "price": 1800 }
              ]
            },
            {
              "name": "男士專屬指壓",
              "items": [
                { "id": "acupressure_1hr", "name": "[指壓]能量健康調理 /1hr", "price": 1000 },
                { "id": "acupressure_1.5hr", "name": "[指壓]能量健康調理 /1.5hr", "price": 1500 }
              ]
            },
            {
              "name": "男士專屬筋膜刀體雕",
              "items": [
                { "id": "fascia_knife_1hr", "name": "筋膜刀體雕 氣脈健康調理 /1hr", "price": 1600 },
                { "id": "fascia_knife_1.5hr", "name": "筋膜刀體雕 氣脈健康調理 /1.5hr", "price": 2200 }
              ]
            },
            {
              "name": "男士專屬SPA",
              "items": [
                { "id": "spa_face", "name": "【臉部】更新油美白煥膚萬年礦泥臉部肌膚調理 /1hr", "price": 1800 },
                { "id": "spa_private", "name": "【私密處】更新油美白換膚萬年礦泥 屁股+私密處 肌膚調理 /1hr", "price": 2200 },
                { "id": "spa_body", "name": "【全身】更新油全身深層敷體淨化 /1.5hr", "price": 3000 }
              ]
            }
          ]
        };

        const fallbackDescMap = {};
        fallbackData.categories.forEach(cat => {
            cat.items.forEach(item => {
                if (item.desc) fallbackDescMap[item.id] = item.desc;
            });
        });

        const formatMoney = (amount) => '$' + Math.round(amount).toLocaleString('zh-TW');

        // 顯示美化的 Toast 通知
        function showToast(message, icon = '✨') {
            const toast = document.getElementById('custom-toast');
            const toastMsg = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');
            
            toastMsg.innerText = message;
            toastIcon.innerText = icon;
            
            // 秀出 Toast
            toast.classList.remove('translate-y-[-100px]', 'opacity-0', 'pointer-events-none');
            toast.classList.add('translate-y-0', 'opacity-100');
            
            // 3秒後自動隱藏
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-[-100px]', 'opacity-0', 'pointer-events-none');
            }, 3500);
        }

        // 自動防錯：Banner載入失敗時自動套用您上傳的專案主視覺 11507_heading.png
        function handleBannerError(imgElement) {
            imgElement.src = '11507_heading.png';
        }

        const getActivePromotion = (promotions) => {
            if (!promotions || promotions.length === 0) return null;
            const now = new Date(); 
            for (const promo of promotions) {
                const start = new Date(promo.start);
                const end = new Date(promo.end);
                end.setHours(23, 59, 59, 999); 
                if (now >= start && now <= end) return promo; 
            }
            return null;
        };

        function updatePromoSectionVisibility(type) {
            const promoList = document.getElementById('promo-list');
            const specialMsg = document.getElementById('special-discount-msg');
            const specialTitle = document.getElementById('special-discount-title');
            const specialDesc = document.getElementById('special-discount-desc');
            const specialIcon = document.getElementById('special-discount-icon');
            const promoHeaderIcon = document.getElementById('promo-header-icon');
            const promoHeaderText = document.getElementById('promo-header-text');

            if (type === 'normal') {
                promoHeaderIcon.innerText = '🔥';
                promoHeaderText.innerText = '本月活動與優惠';
                if (hasPromoItems) promoList.classList.remove('hidden');
                specialMsg.classList.add('hidden');
            } else {
                promoHeaderIcon.innerText = '🎉';
                promoHeaderText.innerText = '專屬身份優惠已套用';
                promoList.classList.add('hidden');
                specialMsg.classList.remove('hidden');

                if (type === 'student') {
                    specialIcon.innerText = '🎓';
                    specialTitle.innerText = '學生尊榮：結帳即享原價 8 折優惠';
                    specialDesc.innerText = '※ 請於結帳時，向服務人員出示本人有效學生證件完成核對。';
                } else if (type === 'birthday') {
                    specialIcon.innerText = '🎂';
                    specialTitle.innerText = '壽星大禮：當月壽星享原價 5 折優惠';
                    specialDesc.innerText = '※ 請於結帳時出示身分證明文件，限核對當月生日。';
                }
            }
        }

        window.setDiscount = function(type) {
            currentDiscountType = type;
            
            // 標籤樣式切換
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-white', 'text-blue-700', 'shadow-sm', 'font-bold');
                btn.classList.add('text-slate-600', 'hover:text-slate-800', 'font-medium');
            });
            const activeBtn = document.getElementById('tab-' + type);
            activeBtn.classList.remove('text-slate-600', 'hover:text-slate-800', 'font-medium');
            activeBtn.classList.add('bg-white', 'text-blue-700', 'shadow-sm', 'font-bold');

            updatePromoSectionVisibility(type);
            renderMenu();
            
            if(type === 'student') {
                showToast('已套用學生 8 折！結帳請出示學生證 🎓', '🎓');
            }
            if(type === 'birthday') {
                showToast('已套用壽星 5 折！結帳請出示身分證 🎂', '🎂');
            }
        };

        function renderMenu() {
            const menuListElement = document.getElementById('menu-list');
            menuListElement.innerHTML = '';
            
            let multiplier = 1;
            if (currentDiscountType === 'student') multiplier = 0.8;
            if (currentDiscountType === 'birthday') multiplier = 0.5;

            currentData.categories.forEach((cat, index) => {
                let catHtml = `<div id="cat-${index}" class="scroll-offset ${cat.name.includes('除毛') ? 'lg:col-span-2' : ''}">`;
                catHtml += `<div class="bg-slate-50/60 p-5 sm:p-6 rounded-2xl h-full border border-slate-100 shadow-sm hover:shadow-md transition duration-300">`;
                catHtml += `<h3 class="font-extrabold text-slate-800 mb-5 text-lg border-l-4 border-blue-600 pl-3">${cat.name}</h3>`;
                
                catHtml += `<div class="${cat.name.includes('除毛') ? 'columns-1 md:columns-2 gap-6' : 'columns-1'}">`;
                
                cat.items.forEach(item => {
                    const finalDesc = item.desc || fallbackDescMap[item.id] || '';
                    const basePrice = item.price;
                    
                    catHtml += `<div class="break-inside-avoid border-b border-slate-200/50 hover:bg-white hover:shadow-md transition-all duration-200 p-3 rounded-xl mb-2 group">
                                  <div class="flex justify-between items-start">
                                    <div class="pr-2">
                                        <div class="text-slate-800 font-semibold group-hover:text-blue-700 transition duration-150">${item.name}</div>
                                        ${finalDesc ? `<div class="text-xs text-slate-400 mt-1 leading-relaxed">${finalDesc}</div>` : ''}
                                    </div>
                                    <div class="text-right whitespace-nowrap pt-0.5">`;
                    
                    if (multiplier !== 1) {
                        const calcPrice = basePrice * multiplier;
                        catHtml += `<div class="price-line-through block sm:inline">${formatMoney(basePrice)}</div>
                                    <div class="text-blue-600 font-extrabold block sm:inline text-base">${formatMoney(calcPrice)}</div>`;
                    } else {
                        const activePromo = getActivePromotion(item.promotions);
                        if (activePromo) {
                            catHtml += `<div class="price-line-through block sm:inline">${formatMoney(basePrice)}</div>
                                        <div class="promo-price block sm:inline text-base">${formatMoney(activePromo.price)}</div>`;
                        } else {
                            catHtml += `<span class="text-slate-700 font-bold">${formatMoney(basePrice)}</span>`;
                        }
                    }
                    catHtml += `    </div>
                                  </div>
                                </div>`;
                });
                catHtml += `</div></div></div>`;
                menuListElement.innerHTML += catHtml;
            });
        }

        async function init() {
            try {
                const res = await fetch('services.json');
                if (res.ok) {
                    currentData = await res.json();
                } else {
                    currentData = fallbackData;
                }
            } catch (err) {
                currentData = fallbackData; 
            }

            const now = new Date();
            const twYear = now.getFullYear() - 1911;
            const month = now.getMonth() + 1; // 2026年6月
            
            // 自動更新副標題為「XX年XX月 清爽計畫」
            document.getElementById('page-subtitle').innerText = `${twYear}年${month}月 打造夏日清爽型男`;

            // 自動根據系統月份，載入資料夾內的動態插圖
            const bannerImg = document.getElementById('month-banner');
            bannerImg.src = `img/${month}_heading.png`;

            const itemsMap = new Map();
            currentData.categories.forEach(cat => {
                cat.items.forEach(item => itemsMap.set(item.id, item));
            });

            // --- 產生頂部快速跳轉 ---
            const quickJumpElement = document.getElementById('quick-jump');
            let quickJumpHtml = '';
            currentData.categories.forEach((cat, index) => {
                const shortName = cat.name.replace('男士專屬', '');
                quickJumpHtml += `<a href="#cat-${index}" class="bg-blue-50 text-blue-600 border border-blue-100/60 hover:bg-blue-600 hover:text-white px-3.5 py-1.5 rounded-full text-xs font-bold shadow-sm transition-all duration-200">${shortName}</a>`;
            });
            quickJumpElement.innerHTML = quickJumpHtml;

            // --- 處理本月熱門優惠 ---
            const promoListElement = document.getElementById('promo-list');
            promoListElement.innerHTML = ''; // 清空
            
            if (currentData.combos) {
                currentData.combos.forEach(combo => {
                    const activePromo = getActivePromotion(combo.promotions);
                    if (activePromo) {
                        hasPromoItems = true;
                        const originalPrice = combo.itemIds.reduce((sum, id) => {
                            const item = itemsMap.get(id);
                            return sum + (item ? item.price : 0);
                        }, 0);
                        promoListElement.innerHTML += createPromoHtml(combo.name, originalPrice, activePromo.price, activePromo.label);
                    }
                });
            }

            currentData.categories.forEach(cat => {
                cat.items.forEach(item => {
                    const activePromo = getActivePromotion(item.promotions);
                    if (activePromo) {
                        hasPromoItems = true;
                        promoListElement.innerHTML += createPromoHtml(item.name, item.price, activePromo.price, activePromo.label);
                    }
                });
            });

            if (hasPromoItems) {
                document.getElementById('promo-list').classList.remove('hidden');
            } else {
                // 如果無促銷項目，則顯示預設宣傳卡
                promoListElement.innerHTML = `
                    <div class="col-span-full bg-slate-50 p-6 rounded-xl border border-dashed border-slate-300 text-center text-slate-500 font-medium">
                        🔍 暫無本月活動，歡迎直接參考下方熱門服務或使用身分折扣！
                    </div>
                `;
                document.getElementById('promo-list').classList.remove('hidden');
            }

            renderMenu();

            document.getElementById('loading').classList.add('hidden');
            document.getElementById('content').classList.remove('hidden');
        }

        function createPromoHtml(name, originalPrice, promoPrice, label) {
            return `
                <div class="group flex flex-col sm:flex-row sm:justify-between sm:items-center bg-gradient-to-br from-white to-slate-50 p-4 rounded-xl border border-blue-100 shadow-sm relative overflow-hidden transition hover:shadow-md">
                    <div class="absolute top-0 right-0 bg-red-500 text-white text-[10px] px-2.5 py-1 rounded-bl-lg font-black tracking-wide">${label}</div>
                    <span class="font-bold text-slate-800 mt-2 sm:mt-0 pr-6 pl-1 group-hover:text-blue-600 transition">${name}</span>
                    <div class="mt-2 sm:mt-0 flex items-center justify-end">
                        <span class="price-line-through">${formatMoney(originalPrice)}</span>
                        <span class="promo-price text-lg ml-1 font-extrabold">${formatMoney(promoPrice)}</span>
                    </div>
                </div>
            `;
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
