<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服務價目表 - DeDe 男士專屬美容美體中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html { scroll-behavior: smooth; }
        .ocean-gradient { background: linear-gradient(135deg, #e0f2f1 0%, #b2ebf2 100%); }
        .price-line-through { text-decoration: line-through; color: #7f8c8d; font-size: 0.9em; margin-right: 8px; }
        .promo-price { color: #e53e3e; font-weight: bold; }
        
        /* 自訂滾動軸預留空間，避免被頂部懸浮選單遮擋 */
        .scroll-offset { scroll-margin-top: 180px; } 
    </style>
</head>
<body class="ocean-gradient min-h-screen text-gray-800 pb-16">

    <div class="w-full max-w-7xl mx-auto bg-white min-h-screen shadow-xl overflow-hidden relative" id="app">
        <div class="bg-blue-600 text-white p-6 text-center">
            <h1 class="text-2xl font-bold">DeDe 男士專屬美容美體中心</h1>
            <p class="text-blue-100 mt-1 tracking-wider" id="page-subtitle">載入中...</p>
        </div>

        <div class="sticky top-0 z-40 bg-white/95 backdrop-blur-sm shadow-md border-b border-gray-200 px-4 py-3 w-full">
            <div id="quick-jump" class="flex flex-wrap justify-center gap-2 mb-3">
                </div>
            <div class="flex justify-center gap-2">
                <button onclick="setDiscount('normal')" id="tab-normal" class="tab-btn bg-blue-600 text-white px-4 py-1.5 rounded-lg text-sm font-bold shadow-sm transition">一般原價</button>
                <button onclick="setDiscount('student')" id="tab-student" class="tab-btn bg-gray-100 text-gray-600 hover:bg-gray-200 px-4 py-1.5 rounded-lg text-sm font-bold transition">學生 8 折</button>
                <button onclick="setDiscount('birthday')" id="tab-birthday" class="tab-btn bg-gray-100 text-gray-600 hover:bg-gray-200 px-4 py-1.5 rounded-lg text-sm font-bold transition">壽星 5 折</button>
            </div>
        </div>

        <div class="p-4 md:p-8 pb-16">
            <div id="loading" class="text-center py-10 text-gray-500">
                正在讀取最新優惠資訊...
            </div>

            <div id="content" class="hidden">
                <section id="promo-section" class="mb-10">
                    <h2 class="text-xl font-bold text-blue-800 mb-4 border-b-2 border-blue-200 pb-2 flex items-center">
                        <span class="mr-2">🔥</span> 本月活動與優惠
                    </h2>
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                        <div id="promo-list" class="grid grid-cols-1 gap-4 hidden">
                            </div>
                        
                        <div class="bg-gradient-to-r from-yellow-50 to-orange-50 p-5 rounded-xl border border-yellow-200 shadow-sm flex flex-col justify-center relative overflow-hidden">
                            <div class="absolute -right-4 -top-4 text-6xl opacity-20">🎁</div>
                            <h3 class="font-bold text-yellow-800 text-lg mb-2 flex items-center">
                                <span class="mr-2">🎁</span> 會員集點活動
                            </h3>
                            <div class="text-yellow-900 leading-relaxed">
                                消費滿 <strong class="text-red-500">$1,500</strong> 即可集 1 點<br>
                                集滿 10 點立即折抵 <strong class="text-red-500">$500</strong> 元
                            </div>
                            <div class="text-xs text-yellow-700 mt-3 pt-3 border-t border-yellow-200/50">
                                ※ 備註：折扣與集點額度皆以結帳「實付金額」計算
                            </div>
                        </div>
                    </div>
                </section>

                <section>
                    <h2 class="text-xl font-bold text-blue-800 mb-6 border-b-2 border-blue-200 pb-2 flex items-center">
                        <span class="mr-2">📋</span> 完整服務項目
                    </h2>
                    <div id="menu-list" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-8">
                        </div>
                </section>
            </div>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 w-full z-50 p-4 pointer-events-none flex justify-center">
        <a href="https://lin.ee/6fc6qGl" target="_blank" class="pointer-events-auto bg-[#06C755] text-white font-bold py-3 px-6 rounded-full shadow-[0_4px_20px_rgba(6,199,85,0.4)] hover:bg-[#05b34c] transition transform hover:-translate-y-1 flex items-center justify-center w-full max-w-md">
            <svg class="w-8 h-8 mr-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
                <rect fill="#ffffff" width="320" height="320" rx="72.14"/>
                <path fill="#06c755" d="M266.66,144.92c0-47.74-47.86-86.58-106.69-86.58S53.28,97.18,53.28,144.92c0,42.8,38,78.65,89.22,85.42,3.48.75,8.21,2.29,9.4,5.26,1.08,2.7.71,6.93.35,9.65,0,0-1.25,7.53-1.52,9.13-.47,2.7-2.15,10.55,9.24,5.76s61.44-36.18,83.82-61.95h0C259.25,181.24,266.66,164,266.66,144.92Z"/>
                <path fill="#ffffff" d="M231.16,172.49h-30a2,2,0,0,1-2-2v0h0V123.94h0v0a2,2,0,0,1,2-2h30a2,2,0,0,1,2,2v7.57a2,2,0,0,1-2,2H210.79v7.85h20.37a2,2,0,0,1,2,2V151a2,2,0,0,1-2,2H210.79v7.86h20.37a2,2,0,0,1,2,2v7.56A2,2,0,0,1,231.16,172.49Z"/>
                <path fill="#ffffff" d="M120.29,172.49a2,2,0,0,0,2-2v-7.56a2,2,0,0,0-2-2H99.92v-37a2,2,0,0,0-2-2H90.32a2,2,0,0,0-2,2v46.53h0v0a2,2,0,0,0,2,2h30Z"/>
                <rect fill="#ffffff" x="128.73" y="121.85" width="11.64" height="50.64" rx="2.04"/>
                <path fill="#ffffff" d="M189.84,121.85h-7.56a2,2,0,0,0-2,2v27.66l-21.3-28.77a1.2,1.2,0,0,0-.17-.21v0l-.12-.12,0,0-.11-.09-.06,0-.11-.08-.06,0-.11-.06-.07,0-.11,0-.07,0-.12,0-.08,0-.12,0h-.08l-.11,0h-7.71a2,2,0,0,0-2,2v46.56a2,2,0,0,0,2,2h7.57a2,2,0,0,0,2-2V142.81l21.33,28.8a2,2,0,0,0,.52.52h0l.12.08.06,0,.1.05.1,0,.07,0,.14,0h0a2.42,2.42,0,0,0,.54.07h7.52a2,2,0,0,0,2-2V123.89A2,2,0,0,0,189.84,121.85Z"/>
            </svg>
            <span class="text-[15px] sm:text-base tracking-wide">本中心採預約制，立即透過 LINE 預約</span>
        </a>
    </div>

    <script>
        let currentData = null;
        let currentDiscountType = 'normal'; // 'normal', 'student', 'birthday'

        const fallbackData = {
          "categories": [
            {
              "name": "男士專屬除毛",
              "items": [
                { "id": "private_full", "name": "私密處除毛 (全除)", "price": 1900, "desc": "含三角處、陰莖、陰囊、會陰、肛門、鼠蹊部" },
                { "id": "nose", "name": "鼻毛", "price": 200 },
                { "id": "private_shape", "name": "私密處除毛 (局部/造型)", "price": 1900 },
                { "id": "private_trim", "name": "私密處毛修剪-一般修剪無痛(修剪+沐浴)", "price": 300 },
                { "id": "belly_lower", "name": "三角處除毛(下腹毛以下,根部以上)", "price": 800, "desc": "腹部下方至陰莖上方區域" },
                { "id": "armpit", "name": "腋下毛", "price": 600 },
                { "id": "belly_upper", "name": "上腹部毛(肚臍以上胸部以下)", "price": 600 },
                { "id": "belly_middle", "name": "下腹部毛(肚臍以下陰毛以上)", "price": 600 },
                { "id": "arm_half", "name": "半手臂", "price": 1600, "desc": "上手臂或下手臂擇一" },
                { "id": "arm_full", "name": "全手臂", "price": 3000, "desc": "上手臂及下手臂" },
                { "id": "finger", "name": "手指", "price": 300 },
                { "id": "hand_back", "name": "手背", "price": 300 },
                { "id": "toe", "name": "腳趾", "price": 300 },
                { "id": "foot_back", "name": "腳背", "price": 300 },
                { "id": "leg_calf", "name": "小腿", "price": 1900 },
                { "id": "leg_thigh", "name": "大腿", "price": 1900 },
                { "id": "leg_full", "name": "全腿", "price": 3500, "desc": "大腿及小腿" },
                { "id": "nipple", "name": "奶頭毛", "price": 200 },
                { "id": "chest", "name": "胸毛", "price": 600 },
                { "id": "private_area", "name": "區域單獨除毛", "price": 600, "desc": "陰莖、陰囊、會陰、肛門、鼠蹊部擇一部位" },
                { "id": "beard", "name": "鬍子熱蠟除毛(八字鬍與下巴)", "price": 1000 },
                { "id": "private_combo_part", "name": "私密處單一區域任選2部位", "price": 1200, "desc": "陰莖、陰囊、會陰、肛門、鼠蹊部擇兩部位" }
              ]
            },
            {
              "name": "男士專屬油壓",
              "items": [
                { "id": "oil_massage_1hr", "name": "[油推]能量精油 健康調理 /1hr", "price": 1200, "desc": "含機能保養" },
                { "id": "oil_massage_1.5hr", "name": "[油推]能量精油健康調理 /1.5hr", "price": 1800, "desc": "含機能保養" }
              ]
            },
            {
              "name": "男士專屬指壓",
              "items": [
                { "id": "acupressure_1hr", "name": "[指壓]能量健康調理 /1hr", "price": 1000 },
                { "id": "acupressure_1.5hr", "name": "[指壓]能量健康調理 /1.5hr", "price": 1500 }
              ]
            },
            {
              "name": "男士專屬筋膜刀體雕",
              "items": [
                { "id": "fascia_knife_1hr", "name": "筋膜刀體雕 氣脈健康調理 /1hr", "price": 1600 },
                { "id": "fascia_knife_1.5hr", "name": "筋膜刀體雕 氣脈健康調理 /1.5hr", "price": 2200 }
              ]
            },
            {
              "name": "男士專屬SPA",
              "items": [
                { "id": "spa_face", "name": "【臉部】更新油美白煥膚萬年礦泥臉部肌膚調理 /1hr", "price": 1800 },
                { "id": "spa_private", "name": "【私密處】更新油美白換膚萬年礦泥 屁股+私密處 肌膚調理 /1hr", "price": 2200 },
                { "id": "spa_body", "name": "【全身】更新油全身深層敷體淨化 /1.5hr", "price": 3000 }
              ]
            }
          ]
        };

        const fallbackDescMap = {};
        fallbackData.categories.forEach(cat => {
            cat.items.forEach(item => {
                if (item.desc) fallbackDescMap[item.id] = item.desc;
            });
        });

        const formatMoney = (amount) => '$' + Math.round(amount).toLocaleString('zh-TW');

        const getActivePromotion = (promotions) => {
            if (!promotions || promotions.length === 0) return null;
            const now = new Date(); 
            for (const promo of promotions) {
                const start = new Date(promo.start);
                const end = new Date(promo.end);
                end.setHours(23, 59, 59, 999); 
                if (now >= start && now <= end) return promo; 
            }
            return null;
        };

        // 切換優惠標籤的邏輯
        window.setDiscount = function(type) {
            currentDiscountType = type;
            
            // 更新按鈕樣式
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white');
                btn.classList.add('bg-gray-100', 'text-gray-600');
            });
            const activeBtn = document.getElementById('tab-' + type);
            activeBtn.classList.remove('bg-gray-100', 'text-gray-600');
            activeBtn.classList.add('bg-blue-600', 'text-white');

            // 重新渲染選單
            renderMenu();
            
            // 若為特殊身份，跳出友善提示
            if(type === 'student') alert('已切換為學生專屬 8 折優惠！\n請於結帳時出示有效學生證件。');
            if(type === 'birthday') alert('已切換為當月壽星 5 折優惠！\n請於結帳時出示身分證件核對生日。');
        };

        // 渲染完整服務清單
        function renderMenu() {
            const menuListElement = document.getElementById('menu-list');
            menuListElement.innerHTML = '';
            
            // 決定目前的折扣乘數 (基於原價)
            let multiplier = 1;
            let discountLabel = '';
            if (currentDiscountType === 'student') { multiplier = 0.8; discountLabel = '學生價'; }
            if (currentDiscountType === 'birthday') { multiplier = 0.5; discountLabel = '壽星價'; }

            currentData.categories.forEach((cat, index) => {
                let catHtml = `<div id="cat-${index}" class="scroll-offset ${cat.name.includes('除毛') ? 'lg:col-span-2' : ''}">`;
                catHtml += `<div class="bg-blue-50/40 p-4 sm:p-5 rounded-2xl h-full border border-blue-100 shadow-sm">`;
                catHtml += `<h3 class="font-bold text-gray-800 mb-4 text-lg border-l-4 border-blue-500 pl-3">${cat.name}</h3>`;
                
                catHtml += `<div class="${cat.name.includes('除毛') ? 'columns-1 md:columns-2 gap-6' : 'columns-1'}">`;
                
                cat.items.forEach(item => {
                    const finalDesc = item.desc || fallbackDescMap[item.id] || '';
                    const basePrice = item.price;
                    
                    catHtml += `<div class="break-inside-avoid border-b border-white hover:bg-white hover:shadow-sm transition p-2.5 rounded-xl mb-1">
                                  <div class="flex justify-between items-start">
                                    <div class="pr-2">
                                        <div class="text-gray-800 font-medium">${item.name}</div>
                                        ${finalDesc ? `<div class="text-[13px] text-gray-500 mt-1">${finalDesc}</div>` : ''}
                                    </div>
                                    <div class="text-right whitespace-nowrap pt-0.5">`;
                    
                    if (multiplier !== 1) {
                        // 套用身分折扣 (學生/壽星)
                        const calcPrice = basePrice * multiplier;
                        catHtml += `<div class="price-line-through block sm:inline">${formatMoney(basePrice)}</div>
                                    <div class="text-blue-600 font-bold block sm:inline text-base">${formatMoney(calcPrice)}</div>`;
                    } else {
                        // 一般狀態：檢查是否有本月特價
                        const activePromo = getActivePromotion(item.promotions);
                        if (activePromo) {
                            catHtml += `<div class="price-line-through block sm:inline">${formatMoney(basePrice)}</div>
                                        <div class="promo-price block sm:inline text-base">${formatMoney(activePromo.price)}</div>`;
                        } else {
                            catHtml += `<span class="text-gray-700 font-medium">${formatMoney(basePrice)}</span>`;
                        }
                    }
                    catHtml += `    </div>
                                  </div>
                                </div>`;
                });
                catHtml += `</div></div></div>`;
                menuListElement.innerHTML += catHtml;
            });
        }

        async function init() {
            try {
                const res = await fetch('services.json');
                if (res.ok) {
                    currentData = await res.json();
                } else {
                    currentData = fallbackData;
                }
            } catch (err) {
                currentData = fallbackData; 
            }

            const now = new Date();
            const twYear = now.getFullYear() - 1911;
            const month = now.getMonth() + 1;
            document.getElementById('page-subtitle').innerText = `${twYear}年${month}月 服務價目表`;

            const itemsMap = new Map();
            currentData.categories.forEach(cat => {
                cat.items.forEach(item => itemsMap.set(item.id, item));
            });

            // --- 產生頂部快速跳轉 ---
            const quickJumpElement = document.getElementById('quick-jump');
            let quickJumpHtml = '';
            currentData.categories.forEach((cat, index) => {
                const shortName = cat.name.replace('男士專屬', '');
                quickJumpHtml += `<a href="#cat-${index}" class="bg-blue-50 text-blue-700 border border-blue-200 hover:bg-blue-100 px-3 py-1 rounded-full text-sm font-bold shadow-sm transition">${shortName}</a>`;
            });
            quickJumpElement.innerHTML = quickJumpHtml;

            // --- 處理本月熱門優惠 ---
            const promoListElement = document.getElementById('promo-list');
            let hasPromo = false;

            if (currentData.combos) {
                currentData.combos.forEach(combo => {
                    const activePromo = getActivePromotion(combo.promotions);
                    if (activePromo) {
                        hasPromo = true;
                        const originalPrice = combo.itemIds.reduce((sum, id) => {
                            const item = itemsMap.get(id);
                            return sum + (item ? item.price : 0);
                        }, 0);
                        promoListElement.innerHTML += createPromoHtml(combo.name, originalPrice, activePromo.price, activePromo.label);
                    }
                });
            }

            currentData.categories.forEach(cat => {
                cat.items.forEach(item => {
                    const activePromo = getActivePromotion(item.promotions);
                    if (activePromo) {
                        hasPromo = true;
                        promoListElement.innerHTML += createPromoHtml(item.name, item.price, activePromo.price, activePromo.label);
                    }
                });
            });

            if (hasPromo) {
                document.getElementById('promo-list').classList.remove('hidden');
            }

            // 初始渲染選單
            renderMenu();

            // 顯示內容
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('content').classList.remove('hidden');
        }

        function createPromoHtml(name, originalPrice, promoPrice, label) {
            return `
                <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center bg-white p-3 sm:p-4 rounded-xl border border-blue-100 shadow-sm relative overflow-hidden">
                    <div class="absolute top-0 right-0 bg-red-500 text-white text-[10px] px-2 py-0.5 rounded-bl-lg font-bold">${label}</div>
                    <span class="font-medium text-gray-800 mt-2 sm:mt-0 pr-4 pl-1">${name}</span>
                    <div class="mt-2 sm:mt-0 flex items-center justify-end">
                        <span class="price-line-through">${formatMoney(originalPrice)}</span>
                        <span class="promo-price text-lg ml-1">${formatMoney(promoPrice)}</span>
                    </div>
                </div>
            `;
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
